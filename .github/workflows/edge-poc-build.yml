name: EdgeProof iOS builds
on:
  push:
    branches: [edge-poc]
    paths:
      - "ios-edge-poc/**"
      - ".github/workflows/edge-poc-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios-edge-poc
        run: xcodegen generate
      - name: Compile unsigned simulator app
        working-directory: ios-edge-poc
        run: |
          set -o pipefail
          xcodebuild -project EdgeProof.xcodeproj -scheme EdgeProof -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator build
        run: |
          cd ios-edge-poc/.build/Build/Products/Debug-iphonesimulator/
          zip -qr "$GITHUB_WORKSPACE/EdgeProof-SIMULATOR-ONLY.zip" EdgeProof.app
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeProof-SIMULATOR-ONLY
          path: EdgeProof-SIMULATOR-ONLY.zip
          if-no-files-found: error
      - name: Compile for a real iPhone (unsigned)
        working-directory: ios-edge-poc
        run: |
          set -o pipefail
          xcodebuild -project EdgeProof.xcodeproj -scheme EdgeProof \
            -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath .build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package UNSIGNED iPhone IPA
        run: |
          set -euo pipefail
          APP="ios-edge-poc/.build-device/Build/Products/Debug-iphoneos/EdgeProof.app"
          test -d "$APP"
          mkdir -p "ios-edge-poc/.ipa/Payload"
          cp -R "$APP" ios-edge-poc/.ipa/Payload/
          cd ios-edge-poc/.ipa
          zip -qr "$GITHUB_WORKSPACE/EdgeProof-UNSIGNED-iPhone.ipa" Payload
          unzip -l "$GITHUB_WORKSPACE/EdgeProof-UNSIGNED-iPhone.ipa" | grep -F 'Payload/EdgeProof.app/EdgeProof'
      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: EdgeProof-UNSIGNED-iPhone-IPA
          path: EdgeProof-UNSIGNED-iPhone.ipa
          if-no-files-found: error
